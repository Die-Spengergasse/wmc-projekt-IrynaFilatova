<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donau Fun Rental</title>
<link rel="stylesheet" href="styles.css">
<script defer src="app.js"></script>
</head>

<main class="app">

 <!-- HEADER -->

<header class="header">
<h1>Donau Rental Manager</h1>
<p class="subtitle">Verwaltung von Bootsreservierungen
</p>
</header>
<!-- HOME SECTION -->
<section id="home-section">
<h2>Neue Reservierung</h2>
<p id="booking-message"></p>
<div id="boat-list">
 </div>
 </section>

<!-- BOOKINGS SECTION -->

<section id="booking-section" class="hidden">
<h2>Buchungsübersicht</h2>
<ul id="booking-list">
</ul>
</section>

<!-- WEATHER SECTION -->

<section id="weather-section" class="hidden">
<h2>Wetter an der Donau</h2>
<div class="weather-card">
<p id="weather-text">Loading weather...</p>
</div>
</section>
</main>

<!-- BOTTOM NAVIGATION -->

<nav class="bottom-nav">
<button id="home-btn" type="button" aria-label="Home">🏠</button>
<button id="booking-btn" type="button" aria-label="Bookings">📋</button>
<button id="weather-btn" type="button" aria-label="Weather">☀️
</button>
</nav>

<div id="toast"></div>
</body>
</html>
